name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11
      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate

      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Verify the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Version mismatch: tag=$GITHUB_REF_NAME package.json=$package_version" >&2
            exit 1
          fi

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn type-check
      - run: yarn build
      - run: yarn test

      - name: Verify the packed public exports
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$package_file" >/dev/null
          node --input-type=module <<'NODE'
          const { compile } = await import('@libraz/html-template');
          await import('@libraz/html-template/loaders');
          await import('@libraz/html-template/codegen');
          const template = compile('<TMPL_VAR NAME="who">');
          if (template.render({ who: 'world' }) !== 'world') {
            throw new Error('Packed public export smoke test failed');
          }
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@libraz/html-template@$version" version >/dev/null 2>&1; then
            echo "@libraz/html-template@$version already exists; skipping"
          else
            npm publish --access public --provenance
          fi

      - name: Verify the published package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            published="$(npm view "@libraz/html-template@$version" version 2>/dev/null || true)"
            [[ "$published" == "$version" ]] && exit 0
            sleep 5
          done
          echo "Published package @libraz/html-template@$version was not visible in the registry" >&2
          exit 1
